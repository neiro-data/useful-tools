services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      TIME_TRACKER_DATABASE_PATH: /data/time_tracker.db
      TIME_TRACKER_CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
