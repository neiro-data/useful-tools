[project]
name = "webpage-time-tracker-config"
version = "0.2.0"
description = "Tkinter settings app for the Webpage Time Tracker userscript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.2",
    "pillow>=10.0",
]

[project.scripts]
wtt-config = "config_gui.app:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config_gui"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
