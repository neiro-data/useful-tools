[project]
name = "html-to-epub-server"
version = "0.1.0"
description = "Local loopback server converting captured page HTML to EPUB via html-to-epub"
readme = "README.md"
authors = [
    { name = "neiro", email = "nelsonaeiro+github@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "html-to-epub",
]

[project.scripts]
html2epub-server = "html_to_epub_server.__main__:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
html-to-epub = { path = "..", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "ebooklib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "html_to_epub.*"
ignore_missing_imports = true
