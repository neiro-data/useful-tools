<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Blur</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Face Blur</h1>
    <span class="note">Runs locally. Images never leave this machine.</span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section id="toolbar">
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
    <button id="auto" disabled>Auto (select all)</button>
    <button id="clear" disabled>Clear</button>
    <span class="group">
      <label><input type="radio" name="mode" value="select" checked> Select</label>
      <label><input type="radio" name="mode" value="draw"> Draw</label>
    </span>
    <label>Method
      <select id="method">
        <option value="gaussian">Gaussian</option>
        <option value="pixelate">Pixelate</option>
        <option value="solid">Solid (safest)</option>
      </select>
    </label>
    <label>Strength <input type="range" id="strength" min="1" max="10" value="5"></label>
    <label>Face shape
      <select id="shape"><option value="ellipse">Ellipse</option><option value="rect">Rectangle</option></select>
    </label>
    <label>Format
      <select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select>
    </label>
    <button id="preview" disabled>Preview</button>
    <label><input type="checkbox" id="showOriginal"> Show original</label>
    <button id="download" disabled>Download</button>
    <span id="status" class="note"></span>
  </section>
  <main id="drop">
    <p id="hint">Drop an image here or choose a file.</p>
    <div id="stage" hidden>
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
